<style>

</style></head><body><main>
<div class="top"><div><h1 data-t>Compilador de pseudocodi</h1><p class="s" data-t>Analitza (lèxic, sintaxi, variables) i executa el teu algoritme. Prem un diagnòstic per a anar a la seua línia.</p></div>
<div class="tb"><div class="lang"><button id="lv" class="on">Valencià</button><button id="le">Castellano</button></div><button id="ab" data-t>ℹ Sobre el programa</button></div></div>
<div class="g">
<div class="c"><h2 data-t>Codi</h2><div class="ed"><div id="gt" class="gt">1</div><textarea id="src" wrap="off" spellcheck="false" placeholder="Escriu ací el teu codi..."></textarea></div>
<div class="r"><button data-t id="bo" disabled title="Encara no has apegat cap codi">Carregar l'original</button><button data-t id="bc">Carregar el corregit</button><button data-t id="be">Veure tot el codi</button></div>

</div><div class="c" id="cmpc" hidden style="margin-top:14px"></div>
</main>

<script>
const FIXED_ES=`INICIO
LEER horas_aparcado, tarjeta_cliente, dinero_entregado

SI horas_aparcado <= 2 ENTONCES
  precio_hora <-- 2
SINO
  SI horas_aparcado <= 5 ENTONCES
    precio_hora <-- 1,5
  SINO
    precio_hora <-- 1
  FIN_SI
FIN_SI

precio_inicial <-- horas_aparcado * precio_hora

SI tarjeta_cliente = "SI" ENTONCES
  descuento <-- (precio_inicial * 10) / 100
SINO
  descuento <-- 0
FIN_SI
precio_total <-- precio_inicial - descuento

ESCRIBIR "El coste inicial de tu aparcamiento es ", precio_inicial
ESCRIBIR "El descuento aplicado es de ", descuento
ESCRIBIR "El precio final de tu aparcamiento es ", precio_total

SI dinero_entregado > precio_total ENTONCES
  cambio <-- dinero_entregado - precio_total
  ESCRIBIR "¡Te sobra dinero! Tu cambio es de ", cambio
SINO
  SI dinero_entregado < precio_total ENTONCES
    faltan <-- precio_total - dinero_entregado
    ESCRIBIR "Te faltan ", faltan, " para completar el pago"
  SINO
    ESCRIBIR "Pago exacto. Gracias por tu estancia, ¡BUENA SUERTE!"
  FIN_SI
FIN_SI
FIN`;
const FIXED=`INICI
LLEGIR Hores_aparcat, Target_client, Diners_entregats

SI Hores_aparcat <= 2 LLAVORS
  preu_hora <-- 2
SINO
  SI Hores_aparcat <= 5 LLAVORS
    preu_hora <-- 1,5
  SINO
    preu_hora <-- 1
  FI_SI
FI_SI

preu_inicial <-- Hores_aparcat * preu_hora

SI Target_client = "SI" LLAVORS
  descompte <-- (preu_inicial * 10) / 100
SINO
  descompte <-- 0
FI_SI
preu_total <-- preu_inicial - descompte

MOSTRAR "El cost inicial del teu aparcament es ", preu_inicial
MOSTRAR "El descompte aplicat es de ", descompte
MOSTRAR "El preu final del teu aparcament es ", preu_total

SI Diners_entregats > preu_total LLAVORS
  canvi <-- Diners_entregats - preu_total
  MOSTRAR "Et sobra diners!! El teu canvi es de ", canvi
SINO
  SI Diners_entregats < preu_total LLAVORS
    falten <-- preu_total - Diners_entregats
    MOSTRAR "Et falten ", falten, " per a poder completar el pagament"
  SINO
    MOSTRAR "Pagament exacte. Gracies per la teua estada, BONA SORT!!"
  FI_SI
FI_SI
FI`;
const KW=new Set(['INICI','FI','LLEGIR','SI','LLAVORS','SINO','FI_SI','SI_FI','MOSTRAR','AND','OR','NOT']);
let LANG='va';
const KWES={INICIO:'INICI',LEER:'LLEGIR',ENTONCES:'LLAVORS',SINO:'SINO',SI_NO:'SINO',SI:'SI',FIN_SI:'FI_SI',SI_FIN:'SI_FI',FIN:'FI',MOSTRAR:'MOSTRAR',ESCRIBIR:'MOSTRAR',IMPRIMIR:'MOSTRAR',AND:'AND',OR:'OR',NOT:'NOT'};
function kwm(w){const u=w.toUpperCase();if(LANG==='es'){if(w==='Y')return'AND';if(w==='O')return'OR';if(w==='NO')return'NOT';return KWES[u]||null}return KW.has(u)?u:null}
const KN=k=>LANG==='es'?({LLAVORS:'ENTONCES',FI_SI:'FIN_SI'}[k]||k):k;
function lex(s,dg){const T=[];let i=0,L=1;const n=s.length;
let st=0;const fin=()=>{const q=T[T.length-1];if(q&&q.pos===undefined){q.pos=st;q.end=i}};
while(i<n){fin();st=i;const c=s[i];
if(c==='\n'){T.push({t:'nl',line:L});L++;i++;continue}
if(/[ \t\r\u00a0]/.test(c)){i++;continue}
if(c==='/'&&s[i+1]==='/'){while(i<n&&s[i]!=='\n')i++;continue}
if(/[“”"]/.test(c)){let j=i+1;while(j<n&&!/[“”"\n]/.test(s[j]))j++;
 if(j>=n||s[j]==='\n'){dg.push({sev:'er',line:L,msg:'Cadena de text sense tancar'});i=j;continue}
 T.push({t:'str',v:s.slice(i+1,j),line:L});i=j+1;continue}
if(/\d/.test(c)){let j=i;while(/\d/.test(s[j]||''))j++;
 if((s[j]===','||s[j]==='.')&&/\d/.test(s[j+1]||'')){j++;while(/\d/.test(s[j]||''))j++}
 T.push({t:'num',v:parseFloat(s.slice(i,j).replace(',','.')),line:L});i=j;continue}
if(/[A-Za-zÀ-ÿ_]/.test(c)){let j=i;while(/[\wÀ-ÿ]/.test(s[j]||''))j++;const w=s.slice(i,j),u=w.toUpperCase();
 {const k=kwm(w);T.push(k?{t:'kw',v:k,line:L}:{t:'id',v:w,line:L})};i=j;continue}
if(s.startsWith('<--',i)){T.push({t:'op',v:'<-',line:L});i+=3;continue}
if(s.startsWith('<-',i)||c==='←'){T.push({t:'op',v:'<-',line:L});i+=c==='←'?1:2;continue}
const two=s.slice(i,i+2);if(['<=','>=','<>'].includes(two)){T.push({t:'op',v:two,line:L});i+=2;continue}
if('+-*/(),=<>–—'.includes(c)){T.push({t:'op',v:(c==='–'||c==='—')?'-':c,line:L});i++;continue}
dg.push({sev:'er',line:L,msg:`Caràcter no vàlid «${c}»`});i++}
fin();return T}
function parse(T,dg){let p=0;const extra=[];const eofL=(T[T.length-1]||{line:1}).line;
const pk=()=>T[p]||{t:'eof',line:eofL},nx=()=>T[p++]||pk();
const fail=(m,t=pk())=>{throw{line:t.line,msg:m}};
const op=v=>{const t=pk();return t.t==='op'&&t.v===v};
const acc=v=>op(v)?(p++,true):false;
const kw=v=>{const t=pk();return t.t==='kw'&&t.v===v};
const show=t=>t.t==='nl'?'final de línia':t.t==='eof'?'final del programa':String(t.v);
const end=()=>{const t=pk();if(t.t==='nl')p++;else if(t.t!=='eof')fail(`Element inesperat «${show(t)}» (falta una coma o un operador?)`)};
function prim(){const t=nx();
 if(t.t==='num')return{k:'num',v:t.v,line:t.line};
 if(t.t==='str')return{k:'str',v:t.v,line:t.line};
 if(t.t==='id'){let n=t.v,last=t;const parts=[t.v];while(pk().t==='id'&&pk().line===t.line){last=nx();parts.push(last.v);n+='_'+last.v}
  if(parts.length>1)dg.push({sev:'wa',line:t.line,msg:`Espai dins d'un nom: «${parts.join(' ')}» s'ha interpretat com «${n}»`,fix:{pos:t.pos,end:last.end,text:n,kind:'espai',why:`Un nom de variable no pot portar espais: l'ordinador llig «${parts.join('» i «')}» com a paraules diferents i no sap què fer-ne. S'han unit amb un guió baix perquè siga un únic nom.`}});
  return{k:'var',n,line:t.line,pos:t.pos,end:last.end}}
 if(t.t==='op'&&t.v==='('){const e=or();if(!acc(')'))fail("Falta tancar el parèntesi ')'");return e}
 if(t.t==='op'&&t.v==='-')return{k:'un',o:'-',e:prim(),line:t.line};
 p--;fail(`S'esperava una expressió però s'ha trobat ${show(t)}`,t)}
function mul(){let l=prim();while(op('*')||op('/')){const o=nx();l={k:'bin',o:o.v,l,r:prim(),line:o.line}}return l}
function add(){let l=mul();while(op('+')||op('-')){const o=nx();l={k:'bin',o:o.v,l,r:mul(),line:o.line}}return l}
function cmp(){let l=add();while(['<','>','<=','>=','=','<>'].some(op)){const o=nx();l={k:'bin',o:o.v,l,r:add(),line:o.line}}return l}
function nt(){if(kw('NOT')){const t=nx();return{k:'un',o:'NOT',e:nt(),line:t.line}}return cmp()}
function and(){let l=nt();while(kw('AND')){const t=nx();l={k:'bin',o:'AND',l,r:nt(),line:t.line}}return l}
function or(){let l=and();while(kw('OR')){const t=nx();l={k:'bin',o:'OR',l,r:and(),line:t.line}}return l}
const STOP=['SINO','FI_SI','SI_FI','FI'];
function stmt(){const t=pk(),line=t.line;
 if(t.t==='kw'&&t.v==='LLEGIR'){nx();const ids=[];do{const x=nx();if(x.t!=='id'){p--;fail("S'esperava un nom de variable",x)}ids.push(x.v)}while(acc(','));end();return{k:'read',ids,line}}
 if(t.t==='kw'&&t.v==='MOSTRAR'){nx();const it=[or()];for(;;){if(acc(','))it.push(or());else if(['str','num','id'].includes(pk().t)){dg.push({sev:'wa',line:pk().line,msg:"Falta una coma entre els elements del MOSTRAR; s'ha afegit",fix:{pos:T[p-1].end,end:T[p-1].end,text:',',kind:'coma',why:'Els elements d\'un MOSTRAR s\'han de separar amb comes. Sense la coma, el text i la variable es lligen com una expressió trencada i la instrucció no es pot executar.'}});it.push(or())}else break}end();return{k:'show',it,line}}
 if(t.t==='kw'&&t.v==='SI'){nx();const c=or();if(kw('LLAVORS'))nx();else dg.push({sev:'er',line:T[p-1].line,msg:'Falta LLAVORS després de la condició',fix:{pos:T[p-1].end,end:T[p-1].end,text:' '+KN('LLAVORS'),kind:'llavors',why:'Tot SI necessita la paraula LLAVORS darrere de la condició per a marcar on comença el bloc que s\'executa quan la condició es compleix.'}});end();
  const a=block(STOP);let b=[];if(kw('SINO')){nx();end();b=block(STOP)}
  if(kw('FI_SI'))nx();else if(kw('SI_FI')){dg.push({sev:'wa',line:pk().line,msg:"S'ha escrit «SI_FI»; s'ha interpretat com a FI_SI",fix:{pos:pk().pos,end:pk().end,text:KN('FI_SI'),kind:'tanca',why:'Un SI es tanca amb FI_SI, no amb SI_FI. Amb el tancament equivocat l\'estructura queda oberta i el programa no sap on acaba la decisió.'}});nx()}
  else fail(`Falta FI_SI per a tancar el SI de la línia ${line}`);
  end();return{k:'if',c,a,b,line}}
 if(t.t==='id'){nx();if(!acc('<-'))fail(`S'esperava «<--» després de «${t.v}»`);const e=or();end();return{k:'set',n:t.v,e,line}}
 if(t.t==='kw')fail(`«${t.v}» inesperat ací (falta un SI?)`);
 fail(`Instrucció no reconeguda «${show(t)}»`)}
function block(stops){const r=[];for(;;){while(pk().t==='nl')p++;const t=pk();if(t.t==='eof')break;
 if(t.t==='kw'&&stops.includes(t.v))break;
 const s0=p;try{r.push(stmt())}catch(e){if(!e.msg)throw e;{const a=T[s0],b=T[s0+1];if(a&&a.t==='id'&&b&&b.t==='op'&&b.v==='<-')extra.push(a.v)}dg.push({sev:'er',line:e.line,msg:e.msg});while(pk().t!=='nl'&&pk().t!=='eof')p++;if(pk().t==='nl')p++}}return r}
while(pk().t==='nl')p++;
if(kw('INICI'))nx();else dg.push({sev:'er',line:pk().line,msg:'El programa ha de començar amb INICI'});
let body=[];for(;;){body=body.concat(block(['FI']));
 if(kw('FI')){nx();break}
 if(pk().t==='eof'){dg.push({sev:'er',line:eofL,msg:'Falta FI al final del programa'});break}}
body.extra=extra;return body}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function analyze(prog,dg){const ever=new Map(),inputs=[],reads=new Set(),sg=new Set(),asg=new Map();
function use(e,def){if(e.k==='var'){let k=e.n.toLowerCase();
 if(!ever.has(k)){let best=null,bd=k.length<4?0:(k.length<8?2:3);for(const[kk,nm]of ever){const d=lev(k,kk);if(d<bd){bd=d;best=nm}}
  if(best){dg.push({sev:'wa',line:e.line,msg:`Variable «${e.n}» no definida; s'ha interpretat com «${best}»`,fix:{pos:e.pos,end:e.end,text:best,kind:'nom',why:`La variable «${e.n}» no està definida enlloc (ni amb LLEGIR ni amb una assignació). Pel context i per la semblança, és «${best}»: es tracta d'un error d'escriptura. Una variable ha de tindre exactament el mateix nom a tot arreu on s'use.`}});e.n=best;k=best.toLowerCase()}
  else dg.push({sev:'er',line:e.line,msg:`Variable «${e.n}» no definida`})}
 reads.add(k);if(ever.has(k)&&!def.has(k)&&!sg.has(k)){sg.add(k);dg.push({sev:'wa',line:e.line,msg:`«${e.n}» pot no tindre valor: només s'assigna en algunes branques del SI. Mostra-la dins de la branca on s'assigna.`})}}
 else if(e.k==='bin'){use(e.l,def);use(e.r,def)}else if(e.k==='un')use(e.e,def)}
function redund(s){const c=s.c;if(!(c.k==='bin'&&c.o==='<='&&c.l.k==='var'&&c.r.k==='num'))return;
 for(const x of s.b){const y=x.k==='if'&&x.c.k==='bin'&&x.c.o==='AND'?x.c.l:null;
  if(y&&y.k==='bin'&&y.o==='>'&&y.l.k==='var'&&y.l.n.toLowerCase()===c.l.n.toLowerCase()&&y.r.k==='num'&&y.r.v===c.r.v)
   dg.push({sev:'sg',line:x.line,msg:`«${y.l.n} > ${c.r.v}» sobra: ja és cert perquè estàs dins del SINO de «${c.l.n} <= ${c.r.v}». Pots llevar-la.`})}}
function walk(ss,def){for(const s of ss){
 if(s.k==='read')s.ids.forEach(n=>{ever.set(n.toLowerCase(),n);def.add(n.toLowerCase());inputs.push(n)});

 if(rec.length)h+='<h2 style="margin-top:14px">Millores recomanades (no aplicades)</h2><p class="mu" style="margin:0 0 6px;font-size:13px">No s\'han canviat soles perquè afecten la lògica del programa: decideix tu si t\'interessen.</p><ul>'+rec.map(x=>`<li class="d ${x.sev}"><b>${LB[x.sev]} · línia ${x.line}</b> <span>${esc(x.msg)}</span></li>`).join('')+'</ul>';
